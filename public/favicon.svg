<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradiente para el fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <!-- Gradiente naranja para el icono -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#f97316" stroke-width="2"/>

  <!-- Icono de mapa/territorio estilizado -->
  <g filter="url(#shadow)">
    <!-- Marco del territorio -->
    <path d="M25 22 L75 22 L75 78 L25 78 Z"
          fill="none"
          stroke="url(#orangeGrad)"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Linea horizontal superior -->
    <line x1="25" y1="35" x2="75" y2="35"
          stroke="url(#orangeGrad)"
          stroke-width="2"/>

    <!-- Lineas de division del territorio -->
    <line x1="45" y1="35" x2="45" y2="78"
          stroke="url(#orangeGrad)"
          stroke-width="2"
          stroke-dasharray="4,3"/>

    <line x1="60" y1="35" x2="60" y2="78"
          stroke="url(#orangeGrad)"
          stroke-width="2"
          stroke-dasharray="4,3"/>

    <!-- Numero "T" estilizado en el header -->
    <text x="50" y="32"
          fill="url(#orangeGrad)"
          font-family="Arial, sans-serif"
          font-size="14"
          font-weight="bold"
          text-anchor="middle">T</text>

    <!-- Puntos de ubicacion -->
    <circle cx="35" cy="50" r="4" fill="#fb923c"/>
    <circle cx="52" cy="60" r="3" fill="#f97316"/>
    <circle cx="68" cy="48" r="3.5" fill="#fb923c"/>
    <circle cx="35" cy="70" r="2.5" fill="#f97316"/>
    <circle cx="68" cy="68" r="3" fill="#fb923c"/>
  </g>
</svg>
